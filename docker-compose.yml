services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: ops_admin_dev
      POSTGRES_DB: opsquery
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_admin -d opsquery"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
