  - group
  - trap
- id: customers_without_orders
  question: How many customers have never placed an order?
  expected_sql: SELECT count(*) FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)
  tags:
  - 'null'
  - trap
- id: products_never_ordered
  question: How many products have never been ordered?
  expected_sql: SELECT count(*) FROM products p WHERE NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.id)
  tags:
  - 'null'
  - trap
- id: inventory_below_reorder
  question: How many inventory rows are below their reorder point?
  expected_sql: SELECT count(*) FROM inventory WHERE quantity_on_hand < reorder_point
  tags:
  - filter
- id: inventory_below_reorder_list
  question: List inventory below the reorder point
  expected_sql: SELECT p.name AS product, i.warehouse, i.quantity_on_hand, i.reorder_point FROM inventory i JOIN products p ON p.id = i.product_id
    WHERE i.quantity_on_hand < i.reorder_point ORDER BY i.quantity_on_hand - i.reorder_point, p.name, i.warehouse LIMIT 20
  tags:
  - join
  - filter
- id: refund_count
