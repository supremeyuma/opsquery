  - group
- id: top_products_5
  question: Top 5 products by revenue
  expected_sql: SELECT p.name, sum(oi.line_total) AS revenue FROM order_items oi JOIN products p ON p.id = oi.product_id JOIN orders o ON o.id
    = oi.order_id GROUP BY p.id, p.name ORDER BY revenue DESC, p.name LIMIT 5
  tags:
  - join
  - topn
- id: top_products_3_2025
  question: Top 3 products by revenue in 2025
  expected_sql: SELECT p.name, sum(oi.line_total) AS revenue FROM order_items oi JOIN products p ON p.id = oi.product_id JOIN orders o ON o.id
    = oi.order_id WHERE ordered_at >= '2025-01-01' AND ordered_at < '2026-01-01' GROUP BY p.id, p.name ORDER BY revenue DESC, p.name LIMIT 3
  tags:
  - join
  - topn
  - date
- id: top_customers_5
  question: Top 5 customers by revenue
  expected_sql: SELECT c.name, sum(p.amount) AS revenue FROM customers c JOIN orders o ON o.customer_id = c.id JOIN invoices i ON i.order_id =
    o.id JOIN payments p ON p.invoice_id = i.id GROUP BY c.id, c.name ORDER BY revenue DESC, c.name LIMIT 5
  tags:
  - join
  - topn
- id: top_customers_3_2025
  question: Top 3 customers by revenue in 2025
  expected_sql: SELECT c.name, sum(p.amount) AS revenue FROM customers c JOIN orders o ON o.customer_id = c.id JOIN invoices i ON i.order_id =
    o.id JOIN payments p ON p.invoice_id = i.id WHERE p.paid_at >= '2025-01-01' AND p.paid_at < '2026-01-01' GROUP BY c.id, c.name ORDER BY revenue
    DESC, c.name LIMIT 3
  tags:
  - join
  - topn
  - date
