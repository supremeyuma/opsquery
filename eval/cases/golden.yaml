- id: distinct_customer_names
  question: How many distinct customer names are there?
  expected_sql: SELECT count(DISTINCT name) FROM customers
  tags:
  - aggregation
  - trap
- id: duplicate_customer_names
  question: Which customer names appear more than once?
  expected_sql: SELECT name, count(*) AS n FROM customers GROUP BY name HAVING count(*) > 1 ORDER BY name
